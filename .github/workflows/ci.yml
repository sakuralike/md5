name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m pytest --cov=password_detective --cov-fail-under=80
        env:
          RUN_REDIS_INTEGRATION: "1"
          REDIS_URL: redis://localhost:6379/15
      - name: Verify migration round trip
        env:
          APP_ENV: test
          APP_SECRET_KEY: synthetic-ci-secret-key-for-validation
          DATABASE_URL: sqlite:///./ci-migration.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet build ./apps/desktop-windows/PasswordDetective.Desktop.csproj --configuration Release
      - run: dotnet test ./apps/desktop-windows.tests/PasswordDetective.Desktop.Tests.csproj --configuration Release

  container-images:
    runs-on: ubuntu-latest
    needs: [api, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          tags: password-detective-api:ci
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          push: false
          tags: password-detective-web:ci
          build-args: |
            TARGET_FILTER=@password-detective/web
            TARGET_DIR=apps/web
      - name: Build Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          push: false
          tags: password-detective-admin:ci
          build-args: |
            TARGET_FILTER=@password-detective/admin
            TARGET_DIR=apps/admin
