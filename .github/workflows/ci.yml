name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: password_detective
          MYSQL_USER: password_detective
          MYSQL_PASSWORD: synthetic_mysql_ci
          MYSQL_ROOT_PASSWORD: synthetic_root_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -psynthetic_root_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m pytest --cov=password_detective --cov-fail-under=80
        env:
          RUN_REDIS_INTEGRATION: "1"
          REDIS_URL: redis://localhost:6379/15
      - name: Verify migration round trip
        env:
          APP_ENV: test
          APP_SECRET_KEY: synthetic-ci-secret-key-for-validation
          DATABASE_URL: sqlite:///./ci-migration.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Verify MySQL migration round trip
        env:
          APP_ENV: test
          APP_SECRET_KEY: synthetic-ci-secret-key-for-mysql-validation
          DATABASE_URL: mysql+pymysql://password_detective:synthetic_mysql_ci@127.0.0.1:3306/password_detective
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  security-supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install security gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "apps/api[dev,security]"
          pnpm install --frozen-lockfile
      - name: Run dependency and SAST gates
        shell: pwsh
        run: ./scripts/security-gate.ps1 -PythonCommand python -OutputDirectory .local/security
      - name: Generate repository CycloneDX SBOM
        uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          path: .
          format: cyclonedx-json
          output-file: .local/security/repository-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Validate evidence and write checksums
        run: >-
          python scripts/verify_security_artifacts.py
          --directory .local/security
          --require-repository-sbom
          --write-checksums
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-evidence-${{ github.sha }}
          path: .local/security
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

  dast-security:
    runs-on: ubuntu-latest
    needs: [api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install API and DAST dependencies
        run: python -m pip install -e "apps/api[dev]"
      - name: Run isolated API dynamic security gate
        shell: pwsh
        run: ./scripts/dast-security-gate.ps1 -PythonCommand python -Port 8011 -OutputDirectory .local/security-dast
      - name: Upload DAST evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dast-security-evidence-${{ github.sha }}
          path: .local/security-dast
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [api, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            command: e2e
          - browser: firefox
            command: e2e:firefox
          - browser: webkit
            command: e2e:webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e "apps/api[dev]"
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm ${{ matrix.command }}
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}-failure-evidence
          path: .local/playwright
          include-hidden-files: true
          retention-days: 7

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet build ./apps/desktop-windows/PasswordDetective.Desktop.csproj --configuration Release
      - run: dotnet test ./apps/desktop-windows.tests/PasswordDetective.Desktop.Tests.csproj --configuration Release

  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run isolated MySQL, Redis and worker recovery drill
        shell: pwsh
        run: >-
          ./scripts/recovery-drill.ps1
          -OutputDirectory .local/recovery-wp4-iteration-6
          -ApiPort 18120
          -MySqlPort 13316
          -RedisPort 16379
      - name: Verify recovery evidence
        run: >-
          python scripts/verify_recovery_evidence.py
          --report .local/recovery-wp4-iteration-6/recovery-report.json
          --write-checksums
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-evidence-${{ github.sha }}
          path: .local/recovery-wp4-iteration-6
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install API and performance dependencies
        run: python -m pip install -e "apps/api[dev]"
      - name: Run isolated performance and observability baseline
        shell: pwsh
        run: >-
          ./scripts/performance-baseline.ps1
          -PythonCommand python
          -OutputDirectory .local/performance-wp4-iteration-7
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-evidence-${{ github.sha }}
          path: .local/performance-wp4-iteration-7
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

  candidate-secret-rotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install API dependencies
        run: python -m pip install --disable-pip-version-check -e './apps/api[dev]'
      - name: Run candidate secret key rotation and rollback drill
        run: python scripts/candidate-secret-rotation-drill.py
      - name: Verify candidate secret key rotation evidence
        run: >-
          python scripts/verify_candidate_secret_rotation_evidence.py
          --report .local/candidate-secret-rotation-wp4-iteration-10/rotation-report.json
          --write-checksums
      - name: Upload candidate secret key rotation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-secret-rotation-evidence-${{ github.sha }}
          path: .local/candidate-secret-rotation-wp4-iteration-10
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install monitoring validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate Prometheus and Grafana artifacts
        run: >-
          python scripts/verify_monitoring_config.py
          --report .local/monitoring-wp4-iteration-9/monitoring-report.json
          --write-checksums
      - name: Validate Prometheus syntax and alert rules
        run: >-
          docker run --rm --entrypoint promtool
          -v "${{ github.workspace }}/infra/monitoring/prometheus:/etc/prometheus:ro"
          prom/prometheus:v2.55.1
          check config /etc/prometheus/prometheus.yml
      - name: Validate Alertmanager syntax
        run: >-
          docker run --rm --entrypoint amtool
          -v "${{ github.workspace }}/infra/monitoring/alertmanager:/etc/alertmanager:ro"
          prom/alertmanager:v0.27.0
          check-config /etc/alertmanager/alertmanager.yml
      - name: Run Alertmanager notification drill
        shell: pwsh
        run: >-
          ./scripts/alertmanager-drill.ps1
          -OutputDirectory .local/alertmanager-wp4-iteration-9
          -AlertmanagerPort 19093
          -ReceiverPort 18091
      - name: Verify Alertmanager evidence
        run: >-
          python scripts/verify_alertmanager_evidence.py
          --report .local/alertmanager-wp4-iteration-9/alertmanager-report.json
          --write-checksums
      - name: Run worker queue backlog drill
        shell: pwsh
        run: >-
          ./scripts/worker-backlog-drill.ps1
          -OutputDirectory .local/worker-backlog-wp4-iteration-8
          -ApiPort 18140
          -MySqlPort 13317
          -RedisPort 16380
      - name: Verify worker backlog evidence
        run: >-
          python scripts/verify_worker_backlog_evidence.py
          --report .local/worker-backlog-wp4-iteration-8/worker-backlog-report.json
          --write-checksums
      - name: Upload monitoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-evidence-${{ github.sha }}
          path: .local/monitoring-wp4-iteration-9
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
      - name: Upload Alertmanager evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alertmanager-evidence-${{ github.sha }}
          path: .local/alertmanager-wp4-iteration-9
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
      - name: Upload worker backlog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-backlog-evidence-${{ github.sha }}
          path: .local/worker-backlog-wp4-iteration-8
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn


  multi-instance-stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install stability probe dependencies
        run: python -m pip install -e "apps/api[dev]"
      - name: Test multi-instance evidence validator
        run: python -m pytest scripts/tests/test_verify_multi_instance_stability_evidence.py
      - name: Run multi-instance stability drill
        shell: pwsh
        run: >-
          ./scripts/multi-instance-stability-drill.ps1
          -PythonCommand python
          -DurationSeconds 60
          -OutputDirectory .local/multi-instance-stability-wp4-iteration-11
          -ApiPort 18150
          -MySqlPort 13318
          -RedisPort 16381
      - name: Verify multi-instance stability evidence
        run: >-
          python scripts/verify_multi_instance_stability_evidence.py
          --report .local/multi-instance-stability-wp4-iteration-11/multi-instance-stability-report.json
          --write-checksums
      - name: Upload multi-instance stability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-instance-stability-evidence-${{ github.sha }}
          path: .local/multi-instance-stability-wp4-iteration-11
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

  staging-readiness-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install staging readiness validation dependencies
        run: python -m pip install -e "apps/api[dev]"
      - name: Lint and test staging readiness contract
        run: |
          python -m ruff check scripts/verify_staging_readiness_profile.py scripts/tests/test_verify_staging_readiness_profile.py
          python -m pytest scripts/tests/test_verify_staging_readiness_profile.py
      - name: Generate staging readiness plan
        run: >-
          python scripts/verify_staging_readiness_profile.py
          --profile infra/staging/readiness-profile.example.json
          --repository-root .
          --output .local/staging-readiness-wp4-iteration-12/staging-readiness-plan.json
          --write-checksums
      - name: Upload staging readiness contract
        uses: actions/upload-artifact@v4
        with:
          name: staging-readiness-contract-${{ github.sha }}
          path: .local/staging-readiness-wp4-iteration-12
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  staging-evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install staging evidence validation dependencies
        run: python -m pip install -e "apps/api[dev]"
      - name: Lint and test staging evidence contract
        run: |
          python -m ruff check scripts/verify_staging_execution_evidence.py scripts/tests/test_verify_staging_execution_evidence.py
          python -m pytest scripts/tests/test_verify_staging_execution_evidence.py
      - name: Validate synthetic staging evidence bundle
        run: pwsh ./scripts/staging-evidence-contract.ps1 -PythonCommand python
      - name: Upload staging evidence contract
        uses: actions/upload-artifact@v4
        with:
          name: staging-evidence-contract-${{ github.sha }}
          path: .local/staging-evidence-contract-wp4-iteration-13
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  container-images:
    runs-on: ubuntu-latest
    needs: [api, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          tags: password-detective-api:ci
          load: true
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          push: false
          tags: password-detective-web:ci
          load: true
          build-args: |
            TARGET_FILTER=@password-detective/web
            TARGET_DIR=apps/web
      - name: Build Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          push: false
          tags: password-detective-admin:ci
          load: true
          build-args: |
            TARGET_FILTER=@password-detective/admin
            TARGET_DIR=apps/admin
      - name: Prepare release security evidence directory
        run: mkdir -p .local/security-release
      - name: Scan API image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: password-detective-api:ci
          format: json
          output: .local/security-release/trivy-api-image.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          version: v0.73.0
      - name: Scan Web image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: password-detective-web:ci
          format: json
          output: .local/security-release/trivy-web-image.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          version: v0.73.0
      - name: Scan Admin image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: password-detective-admin:ci
          format: json
          output: .local/security-release/trivy-admin-image.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          version: v0.73.0
      - name: Scan repository for committed secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          input: .
          scanners: secret
          format: json
          output: .local/security-release/trivy-repository-secrets.json
          severity: HIGH,CRITICAL
          skip-dirs: .git,node_modules,apps/api/.venv,.local
          exit-code: "0"
          version: v0.73.0
      - name: Enforce release security findings and expiring acceptances
        run: >-
          python scripts/verify_release_security.py
          --directory .local/security-release
          --risk-acceptances security/risk-acceptances.json
          --write-checksums
      - name: Upload release security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-security-evidence-${{ github.sha }}
          path: .local/security-release
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
