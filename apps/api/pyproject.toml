[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "password-detective-api"
version = "0.1.0"
description = "密码侦探社 FastAPI 模块化单体"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "pydantic-settings>=2.7,<3.0",
  "PyJWT>=2.10,<3.0",
  "argon2-cffi>=23.1,<26.0",
  "email-validator>=2.2,<3.0",
  "pymysql>=1.1,<2.0",
  "redis>=5.2,<7.0",
  "celery>=5.4,<6.0",
  "cryptography>=44,<46",
  "pyotp>=2.9,<3.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.9,<1.0",
  "fakeredis>=2.28,<3.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/password_detective"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.coverage.run]
source = ["password_detective"]
branch = true
