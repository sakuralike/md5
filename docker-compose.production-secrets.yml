x-app-secret-environment: &app-secret-environment
  APP_ENV: production
  BROWSER_COOKIE_SECURE: "true"
  APP_SECRET_KEY: ""
  APP_SECRET_KEY_FILE: /run/secrets/app_secret_key
  DATABASE_URL: ""
  DATABASE_URL_FILE: /run/secrets/database_url
  REDIS_URL: ""
  REDIS_URL_FILE: /run/secrets/redis_url
  CANDIDATE_SECRET_KEY_VERSION: ""
  CANDIDATE_SECRET_KEY_VERSION_FILE: /run/secrets/candidate_secret_key_version
  CANDIDATE_SECRET_KEYRING: ""
  CANDIDATE_SECRET_KEYRING_FILE: /run/secrets/candidate_secret_keyring
  CANDIDATE_SECRET_DEDUP_KEY: ""
  CANDIDATE_SECRET_DEDUP_KEY_FILE: /run/secrets/candidate_secret_dedup_key
  NOTIFICATION_WEBHOOK_SECRET: ""
  NOTIFICATION_WEBHOOK_SECRET_FILE: /run/secrets/notification_webhook_secret
  NOTIFICATION_SMTP_PASSWORD: ""
  NOTIFICATION_SMTP_PASSWORD_FILE: /run/secrets/notification_smtp_password
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}

x-app-runtime-tmpfs: &app-runtime-tmpfs
  - /run/password-detective-secrets:mode=0700

x-app-secrets: &app-secrets
  - app_secret_key
  - database_url
  - redis_url
  - candidate_secret_key_version
  - candidate_secret_keyring
  - candidate_secret_dedup_key
  - notification_webhook_secret
  - notification_smtp_password

services:
  mysql:
    environment:
      MYSQL_PASSWORD: ""
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_password
      - mysql_root_password
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$(cat /run/secrets/mysql_root_password)" mysqladmin ping -h localhost -uroot --silent

  redis:
    command:
      - sh
      - -ec
      - |
        umask 077
        printf 'requirepass %s\n' "$$(cat /run/secrets/redis_password)" > /tmp/password-detective-redis.conf
        exec redis-server /tmp/password-detective-redis.conf --appendonly yes
    secrets:
      - redis_password
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -q PONG

  api:
    environment: *app-secret-environment
    secrets: *app-secrets
    tmpfs: *app-runtime-tmpfs

  worker:
    environment: *app-secret-environment
    secrets: *app-secrets
    tmpfs: *app-runtime-tmpfs

  scheduler:
    environment: *app-secret-environment
    secrets: *app-secrets
    tmpfs: *app-runtime-tmpfs

secrets:
  app_secret_key:
    file: ${PASSWORD_DETECTIVE_SECRET_DIR:-/opt/password-detective-secrets}/app_secret_key
  database_url:
    file: ${PASSWORD_DETECTIVE_SECRET_DIR:-/opt/password-detective-secrets}/database_url
  redis_url:
    file: ${PASSWORD_DETECTIVE_SECRET_DIR:-/opt/password-detective-secrets}/redis_url
  candidate_secret_key_version:
    file: ${PASSWORD_DETECTIVE_SECRET_DIR:-/opt/password-detective-secrets}/candidate_secret_key_version
  candidate_secret_keyring:
    file: ${PASSWORD_DETECTIVE_SECRET_DIR:-/opt/password-detective-secrets}/candidate_secret_keyring
  candidate_secret_dedup_key:
    file: ${PASSWORD_DETECTIVE_SECRET_DIR:-/opt/password-detective-secrets}/candidate_secret_dedup_key
  notification_webhook_secret:
    file: ${PASSWORD_DETECTIVE_SECRET_DIR:-/opt/password-detective-secrets}/notification_webhook_secret
  notification_smtp_password:
    file: ${PASSWORD_DETECTIVE_SECRET_DIR:-/opt/password-detective-secrets}/notification_smtp_password
  mysql_password:
    file: ${PASSWORD_DETECTIVE_SECRET_DIR:-/opt/password-detective-secrets}/mysql_password
  mysql_root_password:
    file: ${PASSWORD_DETECTIVE_SECRET_DIR:-/opt/password-detective-secrets}/mysql_root_password
  redis_password:
    file: ${PASSWORD_DETECTIVE_SECRET_DIR:-/opt/password-detective-secrets}/redis_password
