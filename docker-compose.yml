name: password-detective

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: password_detective
      MYSQL_USER: password_detective
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password_detective_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_change_me}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports: ["${MYSQL_BIND_ADDRESS:-0.0.0.0}:${MYSQL_PORT:-3306}:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_local_change_me}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_BIND_ADDRESS:-0.0.0.0}:${REDIS_PORT:-6379}:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: integration
      APP_DEBUG: "false"
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      APP_SECRET_KEY_FILE: ${APP_SECRET_KEY_FILE:-}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-120}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-90}
      DATABASE_URL: mysql+pymysql://password_detective:${MYSQL_PASSWORD:-password_detective_local}@mysql:3306/password_detective
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      REDIS_URL: redis://redis:6379/0
      REDIS_URL_FILE: ${REDIS_URL_FILE:-}
      RATE_LIMIT_BACKEND: redis
      RATE_LIMIT_NAMESPACE: password-detective-integration
      NOTIFICATION_BACKEND: ${NOTIFICATION_BACKEND:-log}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      NOTIFICATION_WEBHOOK_SECRET: ${NOTIFICATION_WEBHOOK_SECRET:-}
      NOTIFICATION_WEBHOOK_SECRET_FILE: ${NOTIFICATION_WEBHOOK_SECRET_FILE:-}
      NOTIFICATION_WEBHOOK_TIMEOUT_SECONDS: ${NOTIFICATION_WEBHOOK_TIMEOUT_SECONDS:-10}
      NOTIFICATION_SMTP_HOST: ${NOTIFICATION_SMTP_HOST:-}
      NOTIFICATION_SMTP_PORT: ${NOTIFICATION_SMTP_PORT:-587}
      NOTIFICATION_SMTP_SECURITY: ${NOTIFICATION_SMTP_SECURITY:-starttls}
      NOTIFICATION_SMTP_USERNAME: ${NOTIFICATION_SMTP_USERNAME:-}
      NOTIFICATION_SMTP_PASSWORD: ${NOTIFICATION_SMTP_PASSWORD:-}
      NOTIFICATION_SMTP_PASSWORD_FILE: ${NOTIFICATION_SMTP_PASSWORD_FILE:-}
      NOTIFICATION_SMTP_SENDER_EMAIL: ${NOTIFICATION_SMTP_SENDER_EMAIL:-}
      NOTIFICATION_SMTP_SENDER_NAME: ${NOTIFICATION_SMTP_SENDER_NAME:-密码侦探社}
      NOTIFICATION_SMTP_TIMEOUT_SECONDS: ${NOTIFICATION_SMTP_TIMEOUT_SECONDS:-10}
      CANDIDATE_SECRET_KEY_VERSION: ${CANDIDATE_SECRET_KEY_VERSION:-v1}
      CANDIDATE_SECRET_KEY_VERSION_FILE: ${CANDIDATE_SECRET_KEY_VERSION_FILE:-}
      CANDIDATE_SECRET_KEYRING: ${CANDIDATE_SECRET_KEYRING:-}
      CANDIDATE_SECRET_KEYRING_FILE: ${CANDIDATE_SECRET_KEYRING_FILE:-}
      CANDIDATE_SECRET_DEDUP_KEY: ${CANDIDATE_SECRET_DEDUP_KEY:-}
      CANDIDATE_SECRET_DEDUP_KEY_FILE: ${CANDIDATE_SECRET_DEDUP_KEY_FILE:-}
      REAUTHENTICATION_TTL_MINUTES: ${REAUTHENTICATION_TTL_MINUTES:-5}
      DAILY_REVEAL_QUOTA: ${DAILY_REVEAL_QUOTA:-5}
      AUTHORIZATION_DECLARATION_VERSION: ${AUTHORIZATION_DECLARATION_VERSION:-authorization-v1}
      PRIVACY_EXPORT_TTL_MINUTES: ${PRIVACY_EXPORT_TTL_MINUTES:-15}
      PRIVACY_DELETION_GRACE_HOURS: ${PRIVACY_DELETION_GRACE_HOURS:-168}
      PRIVACY_JOB_BACKEND: ${PRIVACY_JOB_BACKEND:-celery}
      SUBMISSION_PENDING_POINTS: ${SUBMISSION_PENDING_POINTS:-1}
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      AUTO_CREATE_TABLES: "false"
      SITE_ASSET_STORAGE_PATH: /var/lib/password-detective/site-assets
      SITE_LOGO_MAX_BYTES: ${SITE_LOGO_MAX_BYTES:-2097152}
      DESKTOP_UPDATE_STORAGE_PATH: /var/lib/password-detective/desktop-updates
    volumes:
      - desktop-update-data:/var/lib/password-detective/desktop-updates
      - site-asset-data:/var/lib/password-detective/site-assets
    command: ["sh", "-c", "for attempt in 1 2 3 4 5; do if alembic upgrade head; then exec uvicorn password_detective.main:app --host 0.0.0.0 --port 8000; fi; echo alembic-upgrade-failed attempt=$$attempt retrying >&2; sleep 5; done; exit 1"]
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: integration
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      APP_SECRET_KEY_FILE: ${APP_SECRET_KEY_FILE:-}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-120}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-90}
      DATABASE_URL: mysql+pymysql://password_detective:${MYSQL_PASSWORD:-password_detective_local}@mysql:3306/password_detective
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      REDIS_URL: redis://redis:6379/0
      REDIS_URL_FILE: ${REDIS_URL_FILE:-}
      RATE_LIMIT_BACKEND: redis
      RATE_LIMIT_NAMESPACE: password-detective-integration
      NOTIFICATION_BACKEND: ${NOTIFICATION_BACKEND:-log}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      NOTIFICATION_WEBHOOK_SECRET: ${NOTIFICATION_WEBHOOK_SECRET:-}
      NOTIFICATION_WEBHOOK_SECRET_FILE: ${NOTIFICATION_WEBHOOK_SECRET_FILE:-}
      NOTIFICATION_WEBHOOK_TIMEOUT_SECONDS: ${NOTIFICATION_WEBHOOK_TIMEOUT_SECONDS:-10}
      NOTIFICATION_SMTP_HOST: ${NOTIFICATION_SMTP_HOST:-}
      NOTIFICATION_SMTP_PORT: ${NOTIFICATION_SMTP_PORT:-587}
      NOTIFICATION_SMTP_SECURITY: ${NOTIFICATION_SMTP_SECURITY:-starttls}
      NOTIFICATION_SMTP_USERNAME: ${NOTIFICATION_SMTP_USERNAME:-}
      NOTIFICATION_SMTP_PASSWORD: ${NOTIFICATION_SMTP_PASSWORD:-}
      NOTIFICATION_SMTP_PASSWORD_FILE: ${NOTIFICATION_SMTP_PASSWORD_FILE:-}
      NOTIFICATION_SMTP_SENDER_EMAIL: ${NOTIFICATION_SMTP_SENDER_EMAIL:-}
      NOTIFICATION_SMTP_SENDER_NAME: ${NOTIFICATION_SMTP_SENDER_NAME:-密码侦探社}
      NOTIFICATION_SMTP_TIMEOUT_SECONDS: ${NOTIFICATION_SMTP_TIMEOUT_SECONDS:-10}
      CANDIDATE_SECRET_KEY_VERSION: ${CANDIDATE_SECRET_KEY_VERSION:-v1}
      CANDIDATE_SECRET_KEY_VERSION_FILE: ${CANDIDATE_SECRET_KEY_VERSION_FILE:-}
      CANDIDATE_SECRET_KEYRING: ${CANDIDATE_SECRET_KEYRING:-}
      CANDIDATE_SECRET_KEYRING_FILE: ${CANDIDATE_SECRET_KEYRING_FILE:-}
      CANDIDATE_SECRET_DEDUP_KEY: ${CANDIDATE_SECRET_DEDUP_KEY:-}
      CANDIDATE_SECRET_DEDUP_KEY_FILE: ${CANDIDATE_SECRET_DEDUP_KEY_FILE:-}
      REAUTHENTICATION_TTL_MINUTES: ${REAUTHENTICATION_TTL_MINUTES:-5}
      DAILY_REVEAL_QUOTA: ${DAILY_REVEAL_QUOTA:-5}
      AUTHORIZATION_DECLARATION_VERSION: ${AUTHORIZATION_DECLARATION_VERSION:-authorization-v1}
      PRIVACY_EXPORT_TTL_MINUTES: ${PRIVACY_EXPORT_TTL_MINUTES:-15}
      PRIVACY_DELETION_GRACE_HOURS: ${PRIVACY_DELETION_GRACE_HOURS:-168}
      PRIVACY_JOB_BACKEND: ${PRIVACY_JOB_BACKEND:-celery}
      SUBMISSION_PENDING_POINTS: ${SUBMISSION_PENDING_POINTS:-1}
      AUTO_CREATE_TABLES: "false"
      DESKTOP_UPDATE_STORAGE_PATH: /var/lib/password-detective/desktop-updates
    volumes: ["desktop-update-data:/var/lib/password-detective/desktop-updates"]
    command: ["celery", "-A", "password_detective.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}"]
    depends_on:
      api: { condition: service_healthy }

  scheduler:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: integration
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      APP_SECRET_KEY_FILE: ${APP_SECRET_KEY_FILE:-}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-120}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-90}
      DATABASE_URL: mysql+pymysql://password_detective:${MYSQL_PASSWORD:-password_detective_local}@mysql:3306/password_detective
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      REDIS_URL: redis://redis:6379/0
      REDIS_URL_FILE: ${REDIS_URL_FILE:-}
      RATE_LIMIT_BACKEND: redis
      RATE_LIMIT_NAMESPACE: password-detective-integration
      NOTIFICATION_BACKEND: ${NOTIFICATION_BACKEND:-log}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      NOTIFICATION_WEBHOOK_SECRET: ${NOTIFICATION_WEBHOOK_SECRET:-}
      NOTIFICATION_WEBHOOK_SECRET_FILE: ${NOTIFICATION_WEBHOOK_SECRET_FILE:-}
      NOTIFICATION_WEBHOOK_TIMEOUT_SECONDS: ${NOTIFICATION_WEBHOOK_TIMEOUT_SECONDS:-10}
      NOTIFICATION_SMTP_HOST: ${NOTIFICATION_SMTP_HOST:-}
      NOTIFICATION_SMTP_PORT: ${NOTIFICATION_SMTP_PORT:-587}
      NOTIFICATION_SMTP_SECURITY: ${NOTIFICATION_SMTP_SECURITY:-starttls}
      NOTIFICATION_SMTP_USERNAME: ${NOTIFICATION_SMTP_USERNAME:-}
      NOTIFICATION_SMTP_PASSWORD: ${NOTIFICATION_SMTP_PASSWORD:-}
      NOTIFICATION_SMTP_PASSWORD_FILE: ${NOTIFICATION_SMTP_PASSWORD_FILE:-}
      NOTIFICATION_SMTP_SENDER_EMAIL: ${NOTIFICATION_SMTP_SENDER_EMAIL:-}
      NOTIFICATION_SMTP_SENDER_NAME: ${NOTIFICATION_SMTP_SENDER_NAME:-密码侦探社}
      NOTIFICATION_SMTP_TIMEOUT_SECONDS: ${NOTIFICATION_SMTP_TIMEOUT_SECONDS:-10}
      CANDIDATE_SECRET_KEY_VERSION: ${CANDIDATE_SECRET_KEY_VERSION:-v1}
      CANDIDATE_SECRET_KEY_VERSION_FILE: ${CANDIDATE_SECRET_KEY_VERSION_FILE:-}
      CANDIDATE_SECRET_KEYRING: ${CANDIDATE_SECRET_KEYRING:-}
      CANDIDATE_SECRET_KEYRING_FILE: ${CANDIDATE_SECRET_KEYRING_FILE:-}
      CANDIDATE_SECRET_DEDUP_KEY: ${CANDIDATE_SECRET_DEDUP_KEY:-}
      CANDIDATE_SECRET_DEDUP_KEY_FILE: ${CANDIDATE_SECRET_DEDUP_KEY_FILE:-}
      REAUTHENTICATION_TTL_MINUTES: ${REAUTHENTICATION_TTL_MINUTES:-5}
      DAILY_REVEAL_QUOTA: ${DAILY_REVEAL_QUOTA:-5}
      AUTHORIZATION_DECLARATION_VERSION: ${AUTHORIZATION_DECLARATION_VERSION:-authorization-v1}
      PRIVACY_EXPORT_TTL_MINUTES: ${PRIVACY_EXPORT_TTL_MINUTES:-15}
      PRIVACY_DELETION_GRACE_HOURS: ${PRIVACY_DELETION_GRACE_HOURS:-168}
      PRIVACY_JOB_BACKEND: ${PRIVACY_JOB_BACKEND:-celery}
      SUBMISSION_PENDING_POINTS: ${SUBMISSION_PENDING_POINTS:-1}
      AUTO_CREATE_TABLES: "false"
      DESKTOP_UPDATE_STORAGE_PATH: /var/lib/password-detective/desktop-updates
    command: ["celery", "-A", "password_detective.worker.celery_app", "beat", "--schedule=/tmp/celerybeat-schedule", "--loglevel=INFO"]
    depends_on:
      api: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        TARGET_FILTER: "@password-detective/web"
        TARGET_DIR: "apps/web"
        VITE_MAX_ARCHIVE_SIZE_BYTES: ${VITE_MAX_ARCHIVE_SIZE_BYTES:-21474836480}
    ports: ["${WEB_PORT:-5173}:80"]
    depends_on:
      api: { condition: service_healthy }

  admin:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        TARGET_FILTER: "@password-detective/admin"
        TARGET_DIR: "apps/admin"
    ports: ["${ADMIN_PORT:-5174}:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  mysql-data:
  redis-data:
  desktop-update-data:
  site-asset-data:
