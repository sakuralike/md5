global:
  resolve_timeout: 1m
route:
  receiver: password-detective-notification-gateway
  group_by:
    - alertname
    - service
    - severity
    - environment
  group_wait: 2s
  group_interval: 5s
  repeat_interval: 4h
receivers:
  - name: password-detective-notification-gateway
    webhook_configs:
      - url: http://alert-receiver:18081/alerts
        send_resolved: true
        max_alerts: 20
