groups:
  - name: password-detective.availability
    rules:
      - alert: PasswordDetectiveApiTargetDown
        expr: up{job="password-detective-api"} == 0
        for: 2m
        labels:
          severity: critical
          service: api
        annotations:
          summary: Password Detective API metrics target is down
          description: The API metrics target has been unavailable for more than two minutes.
          runbook: docs/runbooks/wp4-monitoring.md
      - alert: PasswordDetectiveDatabaseUnavailable
        expr: password_detective_dependency_up{dependency="database"} == 0
        for: 2m
        labels:
          severity: critical
          service: api
        annotations:
          summary: Password Detective database dependency is unavailable
          description: The API cannot reach the configured database dependency.
          runbook: docs/runbooks/wp4-monitoring.md
      - alert: PasswordDetectiveRedisUnavailable
        expr: password_detective_dependency_up{dependency="redis"} == 0
        for: 2m
        labels:
          severity: critical
          service: api
        annotations:
          summary: Password Detective Redis dependency is unavailable
          description: The API cannot reach the configured Redis dependency.
          runbook: docs/runbooks/wp4-monitoring.md
      - alert: PasswordDetectiveWorkerHeartbeatMissing
        expr: password_detective_dependency_up{dependency="worker"} == 0
        for: 3m
        labels:
          severity: warning
          service: worker
        annotations:
          summary: Password Detective worker heartbeat is missing
          description: No worker heartbeat has been observed for more than three minutes.
          runbook: docs/runbooks/wp4-monitoring.md
  - name: password-detective.performance
    rules:
      - alert: PasswordDetectiveHighErrorRate
        expr: >-
          sum(rate(password_detective_http_requests_total{status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(password_detective_http_requests_total[5m])), 0.001) > 0.01
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: Password Detective API error rate is above one percent
          description: The five-minute HTTP 5xx ratio is above the warning threshold.
          runbook: docs/runbooks/wp4-monitoring.md
      - alert: PasswordDetectiveHighP95Latency
        expr: >-
          histogram_quantile(0.95,
          sum by (le) (rate(password_detective_http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels:
          severity: warning
          service: api
        annotations:
          summary: Password Detective API P95 latency is above 500ms
          description: The five-minute aggregate API request P95 exceeds the baseline threshold.
          runbook: docs/runbooks/wp4-monitoring.md
      - alert: PasswordDetectiveWorkerQueueBacklog
        expr: password_detective_worker_queue_depth >= 20
        for: 5m
        labels:
          severity: warning
          service: worker
        annotations:
          summary: Password Detective worker queue backlog is growing
          description: The default Celery queue has at least twenty waiting tasks for five minutes.
          runbook: docs/runbooks/wp4-monitoring.md
