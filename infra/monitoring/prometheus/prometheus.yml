global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts/*.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
scrape_configs:
  - job_name: password-detective-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets:
          - api:8000
        labels:
          service: api
          environment: integration
