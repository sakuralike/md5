services:
  openbao:
    image: ${OPENBAO_IMAGE:-openbao/openbao:2.6.2}
    command: ["server", "-config=/openbao/config/config.hcl"]
    volumes:
      - openbao-data:/openbao/data
      - ./infra/openbao/config.hcl:/openbao/config/config.hcl:ro
    expose: ["8200"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${STAGING_API_IMAGE:-password-detective-api:staging}
    command: ["uvicorn", "password_detective.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: !reset []
    expose:
      - "8000"
    environment:
      DESKTOP_PLUGIN_STORAGE_PATH: /var/lib/password-detective/desktop-plugins
      DESKTOP_PLUGIN_STORAGE_BACKEND: s3
      DESKTOP_PLUGIN_S3_ENDPOINT_URL: http://plugin-object-storage:9000
      DESKTOP_PLUGIN_S3_BUCKET: ${DESKTOP_PLUGIN_S3_BUCKET:-password-detective-plugins}
      DESKTOP_PLUGIN_S3_REGION: ${DESKTOP_PLUGIN_S3_REGION:-us-east-1}
      DESKTOP_PLUGIN_S3_FORCE_PATH_STYLE: "true"
      DESKTOP_PLUGIN_SIGNING_BACKEND: ${DESKTOP_PLUGIN_SIGNING_BACKEND:-openbao_transit}
      DESKTOP_PLUGIN_SIGNING_URL: ${DESKTOP_PLUGIN_SIGNING_URL:-http://openbao:8200}
      DESKTOP_PLUGIN_SIGNING_TOKEN: ${DESKTOP_PLUGIN_SIGNING_TOKEN:-}
      DESKTOP_PLUGIN_SIGNING_KEY: ${DESKTOP_PLUGIN_SIGNING_KEY:-password-detective-plugin-platform}
    volumes:
      - desktop-plugin-data:/var/lib/password-detective/desktop-plugins
    depends_on:
      plugin-object-storage:
        condition: service_healthy
      openbao:
        condition: service_healthy

  worker:
    image: ${STAGING_API_IMAGE:-password-detective-api:staging}
    environment:
      DESKTOP_PLUGIN_STORAGE_PATH: /var/lib/password-detective/desktop-plugins
      DESKTOP_PLUGIN_STORAGE_BACKEND: s3
      DESKTOP_PLUGIN_S3_ENDPOINT_URL: http://plugin-object-storage:9000
      DESKTOP_PLUGIN_S3_BUCKET: ${DESKTOP_PLUGIN_S3_BUCKET:-password-detective-plugins}
      DESKTOP_PLUGIN_S3_REGION: ${DESKTOP_PLUGIN_S3_REGION:-us-east-1}
      DESKTOP_PLUGIN_S3_FORCE_PATH_STYLE: "true"
      DESKTOP_PLUGIN_SIGNING_BACKEND: ${DESKTOP_PLUGIN_SIGNING_BACKEND:-openbao_transit}
      DESKTOP_PLUGIN_SIGNING_URL: ${DESKTOP_PLUGIN_SIGNING_URL:-http://openbao:8200}
      DESKTOP_PLUGIN_SIGNING_TOKEN: ${DESKTOP_PLUGIN_SIGNING_TOKEN:-}
      DESKTOP_PLUGIN_SIGNING_KEY: ${DESKTOP_PLUGIN_SIGNING_KEY:-password-detective-plugin-platform}
    volumes:
      - desktop-plugin-data:/var/lib/password-detective/desktop-plugins
    depends_on:
      plugin-object-storage:
        condition: service_healthy
      openbao:
        condition: service_healthy

  scheduler:
    image: ${STAGING_API_IMAGE:-password-detective-api:staging}
    environment:
      DESKTOP_PLUGIN_STORAGE_PATH: /var/lib/password-detective/desktop-plugins
      DESKTOP_PLUGIN_STORAGE_BACKEND: s3
      DESKTOP_PLUGIN_S3_ENDPOINT_URL: http://plugin-object-storage:9000
      DESKTOP_PLUGIN_S3_BUCKET: ${DESKTOP_PLUGIN_S3_BUCKET:-password-detective-plugins}
      DESKTOP_PLUGIN_S3_REGION: ${DESKTOP_PLUGIN_S3_REGION:-us-east-1}
      DESKTOP_PLUGIN_S3_FORCE_PATH_STYLE: "true"
    volumes:
      - desktop-plugin-data:/var/lib/password-detective/desktop-plugins
    depends_on:
      plugin-object-storage:
        condition: service_healthy

  plugin-object-storage:
    image: minio/minio:RELEASE.2024-06-29T01-20-47Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${DESKTOP_PLUGIN_S3_ACCESS_KEY_ID:?DESKTOP_PLUGIN_S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${DESKTOP_PLUGIN_S3_SECRET_ACCESS_KEY:?DESKTOP_PLUGIN_S3_SECRET_ACCESS_KEY is required}
    volumes:
      - desktop-plugin-object-data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  api-proxy:
    image: nginx:1.30.4-alpine3.24
    volumes:
      - ./infra/staging/nginx.api-ha.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  desktop-plugin-data:
  desktop-plugin-object-data:
  openbao-data:
