global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts/*.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
scrape_configs:
  - job_name: password-detective-api
    metrics_path: /api/v1/metrics
    dns_sd_configs:
      - names:
          - api
        type: A
        port: 8000
    relabel_configs:
      - target_label: service
        replacement: api
      - target_label: environment
        replacement: staging
