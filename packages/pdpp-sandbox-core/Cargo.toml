sha2 = "0.10.9"
windows-sys = { version = "0.61.0", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Rpc",
] }
